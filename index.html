<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postventa · Rutas</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f9;--s1:#ffffff;--s2:#eef2f7;--line:#e1e7f0;--ink:#121c2e;--mut:#667691;
  --amber:#e8930c;--amber-soft:rgba(232,147,12,.14);--on-amber:#14171f;
  --ok:#0e9a6c;--bad:#d93d2f;--warn:#b98000;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);--r:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1220;--s1:#111c2e;--s2:#18263c;--line:#25344d;--ink:#e9eef7;--mut:#8ea0ba;
  --amber:#ffb547;--amber-soft:rgba(255,181,71,.16);--on-amber:#101a2a;
  --ok:#3ddc97;--bad:#ff6b5e;--warn:#f0c05a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28)}}
:root[data-theme="dark"]{
  --bg:#0a1220;--s1:#111c2e;--s2:#18263c;--line:#25344d;--ink:#e9eef7;--mut:#8ea0ba;
  --amber:#ffb547;--amber-soft:rgba(255,181,71,.16);--on-amber:#101a2a;
  --ok:#3ddc97;--bad:#ff6b5e;--warn:#f0c05a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--s1);z-index:10}
h1,h2,h3{font-family:'Barlow Condensed',Barlow,system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:.005em}
h2{font-size:22px;line-height:1.1}h3{font-size:19px;margin:22px 0 10px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease,background .2s,border-color .2s}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header#top{position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:14px 16px 12px;z-index:5}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.brand small{color:var(--mut);font-size:13px;font-weight:500;text-transform:capitalize}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--mut);font-weight:600;font-size:14px}
.seg button.on{background:var(--amber);border-color:var(--amber);color:var(--on-amber);box-shadow:0 4px 12px -4px var(--amber)}

/* layout */
main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
nav#nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:color-mix(in srgb,var(--s1) 94%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav#nav button{background:none;border:0;padding:6px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:11.5px;font-weight:600;letter-spacing:.01em}
nav#nav button .i{width:40px;height:26px;padding:5px 0;box-sizing:content-box;border-radius:999px;transition:background .2s}
nav#nav button.on{color:var(--ink)}
nav#nav button.on .i{background:var(--amber-soft);color:var(--amber)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpis div{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.kpis b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:30px;line-height:1;font-weight:700}
.kpis span{font-size:12px;color:var(--mut);font-weight:500}
.kpis .bad b{color:var(--bad)}.kpis .ok b{color:var(--ok)}

/* cards */
.card{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .2s}
.card:hover{border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.card:active{transform:scale(.99)}
.card.bad{box-shadow:inset 4px 0 0 var(--bad),var(--shadow)}
.card.warn{box-shadow:inset 4px 0 0 var(--warn),var(--shadow)}
.card.ok{box-shadow:inset 4px 0 0 var(--ok),var(--shadow)}
.cb{flex:1;min-width:0}
.cb p{margin:3px 0 0;color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--s2);color:var(--mut);border:1px solid transparent}
.tag.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.dots{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.dots i{width:16px;height:6px;border-radius:4px;background:var(--line)}
.dots i.no{background:color-mix(in srgb,var(--bad) 70%,transparent)}
.ib{flex:none;width:42px;height:42px;border-radius:14px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.ib:hover{border-color:var(--amber);color:var(--amber)}
.acts-r{display:flex;flex-direction:column;gap:6px}

/* buttons */
.bb{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-height:52px;border-radius:14px;background:var(--s1);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;box-shadow:var(--shadow)}
.bb:hover{border-color:var(--amber)}
.bb.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 100%,#fff 8%),var(--amber));color:var(--on-amber);border-color:transparent;width:100%;box-shadow:0 8px 20px -8px var(--amber)}
.bb.ghost{background:none;border:0;box-shadow:none;flex:none;min-height:40px;width:40px;padding:0}
.big{display:flex;gap:10px;margin:16px 0}
.hero{margin-top:6px}
.hero h2{font-size:30px;font-weight:700}
.hero p{margin:6px 0 0}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 25%,transparent);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14px;color:var(--ink)}
.plist{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;box-shadow:var(--shadow)}
.fam{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 0 4px;display:flex;align-items:center;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow>span{font-weight:500}
.tg{display:flex;gap:6px;flex:none}
.tg button{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--mut);display:grid;place-items:center}
.tg button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tg button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tg button.on{background:var(--s1);color:var(--ink);border-color:var(--mut)}

/* forms */
.form{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
label.lb{font-size:12px;color:var(--mut);display:block;margin:12px 0 6px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--s2);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
textarea{resize:vertical}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 14px;color:var(--mut);box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.search input{border:0;background:none;padding:14px 0;color:var(--ink);box-shadow:none}
.search input:focus{box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.cap{font-size:13px;color:var(--mut);margin:14px 0;line-height:1.5}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1}
.add button{width:50px;flex:none;border-radius:14px;background:var(--amber);border:0;color:var(--on-amber);display:grid;place-items:center;box-shadow:0 6px 14px -6px var(--amber)}
.mut{color:var(--mut)}

/* hist / records */
.hist{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.hist .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.hist .actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.hist .actions button{width:42px;height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center}
.hist .actions button:hover{border-color:var(--amber);color:var(--amber)}
.hist .actions button.del:hover{color:var(--bad);border-color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:36px 16px;background:var(--s1);border:1px dashed var(--line);border-radius:var(--r)}
.empty svg{width:38px;height:38px;color:var(--ok);margin-bottom:8px;opacity:.9}
.empty p{margin:0}

/* sheet/detail */
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--s1),0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.sw.big{width:20px;height:20px}
.stepper{display:flex;align-items:center;gap:4px;flex:none;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:3px}
.stepper button{width:36px;height:36px;border-radius:10px;border:0;background:var(--s1);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepper button:hover{color:var(--amber)}
.stepper input{width:58px;text-align:center;padding:4px 2px;border:0;background:transparent;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px}
.stepper input:focus{box-shadow:none}

/* objectives */
.objrow{padding:12px 0;border-bottom:1px solid var(--line)}
.objrow:last-child{border-bottom:0}
.objtop,.objbot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.bar{height:10px;background:var(--s2);border-radius:99px;overflow:hidden;margin:9px 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.objin{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
.objin input{width:96px;padding:8px;text-align:center;font-weight:700}
.objin input:disabled{opacity:.5}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.mesnav strong{font-family:'Barlow Condensed',sans-serif;font-size:26px;text-transform:capitalize;font-weight:700}
.mesnav .mini{transform:none}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--amber);font-weight:700}
details[open] summary::after{content:"−"}

/* admin */
.fam-card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.fam-card .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fam-card .head strong{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700}
.mini{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--ink);display:grid;place-items:center}
.mini:hover{border-color:var(--amber);color:var(--amber)}
.mini.del:hover{color:var(--bad);border-color:var(--bad)}

.pcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pc{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut);background:var(--s1);line-height:1.2}
.pc b{font-size:13px;line-height:1}
.pc.yes{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 70%,transparent);color:var(--ink)}
.pc.yes b{color:var(--c)}
.pc.no{color:var(--bad);border-style:dashed;border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.cover{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:6px 0 4px;box-shadow:var(--shadow)}
.cov-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.cov-top .mut{font-weight:500;font-size:13px}
.cover .bar{margin:10px 0 0}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px) scale(.98);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;z-index:9;display:flex;gap:8px;align-items:center}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ===== modo juego ===== */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}70%{transform:translateY(-2px)}}
@keyframes draw{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--off)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 50%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
html,body{background:radial-gradient(900px 480px at -5% -10%,rgba(255,181,71,.22),transparent 60%),radial-gradient(800px 460px at 108% 8%,rgba(72,140,255,.18),transparent 60%),radial-gradient(700px 420px at 50% 110%,rgba(255,95,138,.14),transparent 60%),var(--bg);background-attachment:fixed}
header#top{background:linear-gradient(120deg,var(--s1),color-mix(in srgb,var(--amber) 14%,var(--s1)) 55%,color-mix(in srgb,#7c5cff 10%,var(--s1)))}
header#top h1{font-size:24px;font-weight:700;background:linear-gradient(90deg,#ffb547,#ff5f8a,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg button.on{background:linear-gradient(135deg,#ffb547,#ff5f8a);border-color:transparent;color:#fff;box-shadow:0 6px 16px -6px #ff5f8a}
.bb.primary{background:linear-gradient(135deg,#ffb547,#ff5f8a 60%,#7c5cff);color:#fff;box-shadow:0 10px 24px -10px #ff5f8a;text-shadow:0 1px 2px rgba(0,0,0,.2)}
nav#nav{background:color-mix(in srgb,var(--s1) 90%,transparent)}
nav#nav button.on .i{background:linear-gradient(135deg,#ffb547,#ff5f8a);color:#fff;animation:bounce .55s ease}
.kpis div{animation:rise .5s ease both}
.kpis div:nth-child(2){animation-delay:.06s}.kpis div:nth-child(3){animation-delay:.12s}
.kpis b{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
.kpis .ok{background:linear-gradient(160deg,var(--s1),color-mix(in srgb,var(--ok) 16%,var(--s1)))}
.kpis .bad{background:linear-gradient(160deg,var(--s1),color-mix(in srgb,var(--bad) 14%,var(--s1)))}
.ruta-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--s1),color-mix(in srgb,#7c5cff 10%,var(--s1)) 50%,color-mix(in srgb,var(--ok) 12%,var(--s1)));border:1px solid var(--line);border-radius:22px;padding:16px;margin:16px 0 4px;box-shadow:var(--shadow);animation:rise .5s ease both}
.ruta-hero h2{font-size:26px;font-weight:700}
.ring{flex:none;filter:drop-shadow(0 8px 14px color-mix(in srgb,var(--ok) 35%,transparent))}
.rt{fill:none;stroke:var(--s2);stroke-width:9}
.rv{fill:none;stroke:url(#gradRing);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:40px 40px;animation:draw 1.3s cubic-bezier(.2,.8,.2,1) both}
.rtx{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;fill:var(--ink)}
.card{animation:rise .45s ease both;border-radius:20px}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(15,23,42,.35)}
.card.ok{background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 9%,var(--s1)),var(--s1) 40%)}
.card.bad{background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 8%,var(--s1)),var(--s1) 40%)}
.card.warn{background:linear-gradient(90deg,color-mix(in srgb,var(--warn) 9%,var(--s1)),var(--s1) 40%)}
.card .ib{border-radius:14px;transition:transform .15s}
.card .ib:hover{transform:scale(1.08)}
.tag{border-radius:999px}
.tag.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.pc{transition:transform .2s;animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
.pc:hover{transform:translateY(-1px) scale(1.04)}
.pc.yes{box-shadow:0 4px 10px -6px var(--c)}
.pc.no{background:color-mix(in srgb,var(--bad) 6%,var(--s1))}
.cover{background:linear-gradient(135deg,var(--s1),color-mix(in srgb,var(--amber) 9%,var(--s1)));border-radius:20px;animation:rise .45s ease both}
.cov-top span:first-child{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700}
.bar{height:12px;background:linear-gradient(90deg,var(--s2),var(--s2));border-radius:99px}
.bar i{transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;background-image:linear-gradient(90deg,rgba(255,255,255,.25),transparent 60%)!important;border-radius:99px}
.win{color:var(--ok);font-weight:800;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.fam{font-size:12px}
.form{border-radius:20px}
.prow{transition:background .2s;border-radius:12px}
.prow:hover{background:color-mix(in srgb,var(--amber) 6%,transparent)}
.tg button{transition:transform .15s,background .2s}
.tg button:active{transform:scale(.9)}
.tg button.ok{box-shadow:0 6px 12px -6px var(--ok)}
.tg button.bad{box-shadow:0 6px 12px -6px var(--bad)}
.stepper button:active{transform:scale(.88)}
.hist{border-radius:20px;animation:rise .4s ease both}
.empty{border-radius:20px;background:linear-gradient(135deg,var(--s1),color-mix(in srgb,#7c5cff 8%,var(--s1)))}
.empty svg{animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
#toast{background:linear-gradient(135deg,#7c5cff,#ff5f8a);color:#fff;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
</style></head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="nav" aria-label="Secciones"></nav>

const CLIENTS=[];
function seedCli(){
  const out=[],IDX={};
  DATA.forEach(r=>{
    const k=norm(r.c)+'|'+norm(r.n)+'|'+norm(r.a);
    if(!(k in IDX)){IDX[k]=out.length;out.push({k,c:r.c,n:r.n,a:r.a,p:r.p,t:r.t,o:[],days:[]})}
    const cl=out[IDX[k]];
    if(r.o&&!cl.o.includes(r.o))cl.o.push(r.o);
    if(!cl.days.includes(r.d))cl.days.push(r.d);
  });
  return out;
}
function syncCli(){CLIENTS.length=0;S.cli.forEach(c=>CLIENTS.push(c))}

// Makes sure the 11 families exist, whatever data was loaded (local, old backup or Firebase).
function ensureFams(){
  let changed=false;
  FAM_TARGETS.forEach(t=>{
    let f=S.fam.find(x=>norm(x.n).startsWith(norm(t.n)));
    if(!f){f={id:'f'+uid(),c:t.n.slice(0,3).toUpperCase(),n:t.n,col:PALETTE[S.fam.length%PALETTE.length]};S.fam.push(f);changed=true}
    if(!f.ou){f.ou=t.ou;changed=true}
    if(f.ov===undefined){f.ov=t.ov;changed=true}
  });
  if(changed)saveLocal();
  return changed;
}
function load(){
  try{Object.assign(S,JSON.parse(localStorage.getItem('pv1')||'{}'))}catch(e){}
  S.reg=S.reg||{};S.notes=S.notes||{};S.st=S.st||{};S.fb=S.fb||{url:''};S.qty=S.qty||{};S.obj=S.obj||{};S.om=S.om||{};S.hist=S.hist||{};S.real=S.real||{};
  if(!S.fam){S.fam=SEED_FAM.map(x=>({...x}));S.prod=SEED_PROD.map(x=>({...x}));save()}
  S.prod=S.prod||[];
  S.fam.forEach((f,i)=>{if(!f.col)f.col=PALETTE[i%PALETTE.length]});
  ensureFams();
  if(!S.cli){S.cli=seedCli();save()}
  syncCli();
}
function saveLocal(){try{localStorage.setItem('pv1',JSON.stringify(S))}catch(e){}}
function save(){saveLocal();schedulePush()}
let pushT=null;
const fbUrl=()=>((S.fb&&S.fb.url)||'').trim().replace(/\/+$/,'');
const arr=v=>Array.isArray(v)?v:Object.values(v||{});
function schedulePush(){if(!fbUrl())return;clearTimeout(pushT);pushT=setTimeout(()=>fbPush(false),1500)}
async function fbPush(manual){
  const url=fbUrl();if(!url)return;
  try{
    const r=await fetch(url+'/postventa_rutas.json',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cli:S.cli,fam:S.fam,prod:S.prod,reg:S.reg,st:S.st,qty:S.qty,obj:S.obj,om:S.om,hist:S.hist,real:S.real,notes:S.notes,at:Date.now()})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    S.fbAt=Date.now();S.fbErr=false;saveLocal();
    if(manual){toast('Datos subidos a Firebase','check');render()}
  }catch(e){S.fbErr=true;S.fbMsg=e.message;saveLocal();if(manual){toast('No se pudo subir a Firebase','alert');render()}}
}
async function fbPull(){
  if(!fbUrl())return toast('Configura primero la URL','alert');
  if(!confirm('Esto sustituirá los datos de este dispositivo por los de Firebase. ¿Continuar?'))return;
  try{
    const r=await fetch(fbUrl()+'/postventa_rutas.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d)return toast('No hay datos guardados en Firebase','alert');
    S.cli=arr(d.cli).map(c=>({...c,o:arr(c.o),days:arr(c.days)}));
    S.fam=arr(d.fam);S.prod=arr(d.prod);ensureFams();
    S.reg=Object.fromEntries(Object.entries(d.reg||{}).map(([k,v])=>[k,arr(v)]));
    S.st=d.st||{};S.qty=d.qty||{};S.obj=d.obj||{};S.om=d.om||{};S.hist=d.hist||{};S.real=d.real||{};S.notes=d.notes||{};S.fbAt=Date.now();S.fbErr=false;
    syncCli();save();toast('Datos descargados de Firebase','check');render();
  }catch(e){S.fbErr=true;saveLocal();toast('No se pudo conectar con Firebase','alert');render()}
}
function fbSave(){
  const u=document.getElementById('fb_u').value.trim().replace(/\/+$/,'');
  if(u&&!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.(firebasedatabase\.app|firebaseio\.com)$/i.test(u))
    return toast('La URL debe tener el formato https://…firebasedatabase.app','alert');
  S.fb={url:u};S.fbErr=false;saveLocal();
  toast(u?'Conexión guardada':'Conexión vacía');
  if(u)fbPush(true);else render();
}
function fbDisconnect(){S.fb={url:''};S.fbErr=false;saveLocal();toast('Conexión eliminada','x');render()}
function fbCard(){

  return `<section class="form"><div class="brand" style="margin-bottom:6px"><strong style="font-family:'Barlow Condensed',sans-serif;font-size:20px;display:flex;gap:8px;align-items:center">${ic('cloud',20)}Firebase</strong><small class="${S.fbErr?'bad-t':''}" style="color:${S.fbErr?'var(--bad)':'var(--mut)'}">${esc(st)}</small></div>
    <label class="lb">URL de la base de datos (Realtime Database)</label>
    <input id="fb_u" value="${esc(url)}" placeholder="https://tu-proyecto-default-rtdb.europe-west1.firebasedatabase.app">
    <button class="bb primary" style="margin-top:10px" onclick="fbSave()">${ic('check',20)}Guardar conexión</button>
    ${url?`<div class="row2" style="margin-top:8px"><button class="bb" onclick="fbPush(true)">${ic('upload',18)}Subir ahora</button><button class="bb" onclick="fbPull()">${ic('download',18)}Descargar</button></div>
    <button class="bb" style="margin-top:8px;width:100%" onclick="fbDisconnect()">${ic('x',18)}Desconectar</button>`:''}
    <p class="cap">Con conexión activa, los cambios se suben solos unos segundos después de editar, en la ruta <b>postventa_rutas</b>. Revisa las reglas de seguridad de tu base de datos: si son abiertas, cualquiera con la URL puede leer los teléfonos de los clientes.</p></section>`;
}

const openN=i=>(S.reg[CLIENTS[i].k]||[]).filter(x=>x.e==='abierta').length;
const qtyOf=(k,pid)=>{const q=(S.qty[k]||{})[pid];return q===undefined?null:q};
const stOf=(k,pid)=>{const q=qtyOf(k,pid);if(q!==null)return q>0?'si':'no';return (S.st[k]||{})[pid]||''};
const full=i=>S.prod.length&&S.prod.every(p=>stOf(CLIENTS[i].k,p.id)==='si');
const allRecs=()=>CLIENTS.flatMap((c,i)=>(S.reg[c.k]||[]).map(x=>({i,c,x})));
const findRec=id=>{for(const k in S.reg){const x=S.reg[k].find(y=>y.id===id);if(x)return{k,x}}};

function toast(m,icon='check'){const t=document.getElementById('toast');t.innerHTML=ic(icon,16)+esc(m);t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1900)}
function go(v){view=v;render();window.scrollTo(0,0)}
function openC(i){if(view!=='ficha')prev=view;cur=i;go('ficha')}
const days=()=>`<div class="seg" role="tablist">${['TODOS',...DAYS].map(d=>`<button class="${day===d?'on':''}" onclick="day='${d}';render()">${LBL[d]}</button>`).join('')}</div>`;

function render(){
  const tabs=[['ruta','route','Ruta'],['buscar','search','Clientes'],['ofertar','tag','Ofertar'],['obj','chart','Objetivos'],['pend','alert','Pendientes'],['admin','sliders','Admin']];

  document.getElementById('app').innerHTML={ruta,buscar,ofertar,obj,pend,admin,ficha,editar}[view]();

function chipsOf(k){
  return S.prod.map(p=>{
    const q=qtyOf(k,p.id), col=famOf(p.id);
    const st=q===null?'none':q>0?'yes':'no', sym=q===null?'○':q>0?'✓':'✕';
    return `<span class="pc ${st}" style="--c:${col}" title="${esc(p.n)}"><b>${sym}</b>${esc(p.n)}${q>0?' · '+q:''}</span>`;
  }).join('');
}
function card(i){
  const c=CLIENTS[i],n=openN(i),states=S.prod.map(p=>qtyOf(c.k,p.id));
  const tot=S.prod.length, yes=states.filter(q=>q>0).length, no=states.filter(q=>q===0).length;
  const units=states.reduce((s,q)=>s+(q||0),0);
  const tone=n?'bad':(tot&&yes===tot?'ok':(no?'warn':''));
  return `<article class="card ${tone}" onclick="openC(${i})">
    <div class="cb"><h2>${esc(c.n)}</h2><p>${esc(c.a)}</p>
    <div class="meta">${c.days.map(d=>`<span class="tag">${LBL[d]||d}</span>`).join('')}${tot?`<span class="tag">${ic('store',12)}${yes}/${tot}</span>`:''}${units?`<span class="tag">${units} ud</span>`:''}${n?`<span class="tag bad">${ic('alert',12)}${n} abierta${n>1?'s':''}</span>`:''}</div>
    ${tot?`<div class="pcs">${chipsOf(c.k)}</div>`:''}</div>
    <div class="acts-r">
      ${c.t?`<a class="ib" href="tel:${esc(c.t)}" onclick="event.stopPropagation()" aria-label="Llamar">${ic('phone')}</a>

      <a class="ib" href="${mapUrl(c)}" target="_blank" onclick="event.stopPropagation()" aria-label="Abrir mapa">${ic('pin')}</a>
    </div></article>`;
}

function rutaRing(idx){
  const comp=idx.filter(i=>full(i)).length, pct=idx.length?Math.round(comp/idx.length*100):0;
  const r=34,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="ruta-hero">
    <svg class="ring" viewBox="0 0 80 80" width="96" height="96" aria-hidden="true">
      <defs><linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb547"/><stop offset=".5" stop-color="#ff5f8a"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
      <circle cx="40" cy="40" r="${r}" class="rt"/>
      <circle cx="40" cy="40" r="${r}" class="rv" stroke-dasharray="${c}" style="--c:${c};--off:${off}"/>
      <text x="40" y="46" text-anchor="middle" class="rtx">${pct}%</text>
    </svg>
    <div><h2>${pct>=100?'¡Ruta completa! 🎉':pct>=50?'Vas muy bien 💪':'A por la ruta 🚚'}</h2>
    <p class="mut" style="margin:4px 0 0">${comp} de ${idx.length} clientes con todos los productos</p></div></div>`;
}
function ruta(){
  const idx=CLIENTS.map((c,i)=>i).filter(i=>day==='TODOS'||CLIENTS[i].days.includes(day));
  const open=allRecs().filter(o=>o.x.e==='abierta').length;
  const comp=idx.filter(i=>full(i)).length;
  return `${rutaRing(idx)}<div class="kpis"><div><b>${idx.length}</b><span>clientes</span></div>
    <div class="ok"><b>${comp}</b><span>completos</span></div>
    <div class="${open?'bad':'ok'}"><b>${open}</b><span>abiertos</span></div></div>
    ${idx.map(card).join('')||`<div class="empty">${ic('route',34)}<p>No hay clientes para este día.</p></div>`}
    <p class="cap">Los datos se guardan solo en este dispositivo.</p>`;
}

function lst(){
  const t=norm(q);
  return CLIENTS.map((c,i)=>i)
    .filter(i=>{const c=CLIENTS[i];return !t||norm([c.n,c.a,c.p,c.t,c.c].join(' ')).includes(t)})
    .sort((a,b)=>CLIENTS[a].n.localeCompare(CLIENTS[b].n,'es'))
    .map(card).join('')||`<div class="empty">${ic('search',34)}<p>Ningún cliente coincide con la búsqueda.</p></div>`;
}
function buscar(){
  return `<button class="bb primary" style="margin-bottom:12px" onclick="newC()">${ic('plus',20)}Nuevo cliente</button><label class="search">${ic('search')}<input type="search" placeholder="Nombre, calle, contacto o teléfono" value="${esc(q)}"
  oninput="q=this.value;document.getElementById('lst').innerHTML=lst()"></label><div id="lst" style="margin-top:14px">${lst()}</div>`;
}

function ofertar(){
  if(!S.prod.length)return `<div class="empty">${ic('plus',34)}<p>Añade productos en Admin para empezar.</p></div>`;
  if(!S.prod.find(p=>p.id===offP))offP=S.prod[0].id;

  const idx=CLIENTS.map((c,i)=>i)
    .filter(i=>(day==='TODOS'||CLIENTS[i].days.includes(day))&&stOf(CLIENTS[i].k,offP)!=='si')
    .sort((a,b)=>(stOf(CLIENTS[a].k,offP)==='no'?0:1)-(stOf(CLIENTS[b].k,offP)==='no'?0:1));
  return `<div class="seg" style="margin-bottom:12px">${S.prod.map(p=>`<button class="${p.id===offP?'on':''}" onclick="offP='${p.id}';render()"><i class="sw" style="background:${famOf(p.id)}"></i>${esc(p.n)}</button>`).join('')}</div>
  <div class="kpis" style="grid-template-columns:1fr"><div class="bad" style="text-align:left;display:flex;align-items:baseline;gap:10px"><b style="margin:0">${idx.length}</b><span>establecimientos sin «${esc(pn)}» confirmado</span></div></div>
  ${idx.map(i=>{const c=CLIENTS[i],s=stOf(c.k,offP);
    const msg=encodeURIComponent(`Hola${c.p?' '+c.p.split(/[ ,\/]/)[0]:''}, te escribo sobre ${pn}. ¿Te interesa que lo incluya en el próximo reparto?`);
    return `<article class="card ${s==='no'?'bad':'warn'}" onclick="openC(${i})"><div class="cb"><h2>${esc(c.n)}</h2><p>${esc(c.a)}</p>
    <div class="meta"><span class="tag ${s==='no'?'bad':''}">${s==='no'?'Ofertar':'Sin revisar'}</span>${c.days.map(d=>`<span class="tag">${LBL[d]}</span>`).join('')}</div></div>
    <div class="acts-r">${c.t?`<a class="ib" href="https://wa.me/${esc(waNum(c.t))}?text=${msg}" target="_blank" onclick="event.stopPropagation()" aria-label="Ofrecer por WhatsApp">${ic('chat')}</a>`:''}</div></article>`}).join('')||`<div class="empty">${ic('check',34)}<p>Todos los establecimientos del día lo tienen.</p></div>`}`;
}

function pend(){
  const items=allRecs().filter(o=>o.x.e==='abierta').sort((a,b)=>a.x.f<b.x.f?-1:1);

    ||`<div class="empty">${ic('check',34)}<p>Nada pendiente. Todo resuelto.</p></div>`);
}
function resolveRec(id){const r=findRec(id);if(r){r.x.e='resuelta';save();toast('Registro marcado como resuelto');render()}}

}
function admin(){
  return `${fbCard()}${resetCard()}${S.fam.map(f=>`<section class="fam-card">
    <div class="head"><i class="sw big" style="background:${f.col}"></i><strong>${esc(f.n)} <span class="mut" style="font-size:14px">${esc(f.c)}</span></strong>

      <button onclick="addProd('${f.id}')" aria-label="Añadir producto">${ic('plus',20)}</button></div></section>`).join('')}
  <section class="form"><strong style="font-family:'Barlow Condensed',sans-serif;font-size:20px">Importar catálogo</strong>
    <p class="cap" style="margin:4px 0 8px">Una línea por producto con el formato <b>Familia; Producto</b>. Si la familia no existe, se crea.</p>
    <textarea id="imp" rows="5" placeholder="Tónica; Schweppes&#10;Cítricos; Limón&#10;Cítricos; Naranja"></textarea>
    <button class="bb" style="margin-top:10px;width:100%" onclick="importCat()">${ic('upload',18)}Importar</button></section>
  <section class="form"><strong style="font-family:'Barlow Condensed',sans-serif;font-size:20px">Nueva familia de productos</strong>
    <div class="row2"><div><label class="lb">Código</label><input id="fcd" placeholder="TON" maxlength="6"></div>
    <div><label class="lb">Nombre</label><input id="fnm" placeholder="Nombre de la familia"></div></div>
    <div style="margin-top:10px"><label class="lb">Color</label><input type="color" id="fcol" value="${PALETTE[S.fam.length%PALETTE.length]}" style="height:46px"></div>
    <button class="bb primary" style="margin-top:12px" onclick="addFam()">${ic('plus',20)}Añadir familia</button></section>`;

function addFam(){
  const c=document.getElementById('fcd').value.trim().toUpperCase(),n=document.getElementById('fnm').value.trim();
  if(!n)return toast('Escribe el nombre de la familia','alert');
  S.fam.push({id:'f'+uid(),c,n,col:document.getElementById('fcol').value});save();toast('Familia añadida');render();
}
function renFam(id){const f=S.fam.find(x=>x.id===id);const n=prompt('Nuevo nombre',f.n);if(n&&n.trim()){f.n=n.trim();save();toast('Nombre actualizado','edit');render()}}
function setFamCol(id,v){const f=S.fam.find(x=>x.id===id);f.col=v;save();toast('Color actualizado','check');render()}
function delFam(id){if(!confirm('¿Eliminar la familia y sus productos?'))return;S.fam=S.fam.filter(f=>f.id!==id);S.prod=S.prod.filter(p=>p.f!==id);save();toast('Familia eliminada','trash');render()}
function addProd(fid){const el=document.getElementById('np'+fid),n=el.value.trim();if(!n)return;S.prod.push({id:'p'+uid(),f:fid,n});save();toast('Producto añadido');render()}
function renProd(id){const p=S.prod.find(x=>x.id===id);const n=prompt('Nuevo nombre',p.n);if(n&&n.trim()){p.n=n.trim();save();toast('Nombre actualizado','edit');render()}}
function delProd(id){if(!confirm('¿Eliminar este producto?'))return;S.prod=S.prod.filter(p=>p.id!==id);save();toast('Producto eliminado','trash');render()}

function prodRows(k){
  return S.fam.map(f=>{
    const ps=S.prod.filter(p=>p.f===f.id);
    if(!ps.length)return '';
    return `<div class="fam" style="color:${f.col}"><i class="sw" style="background:${f.col}"></i>${esc(f.n)}</div>`+ps.map(p=>{
      const q=qtyOf(k,p.id), v=q===null?0:q;
      const txt=q===null?'Sin revisar':q===0?'No lo tiene · ofertar':'Lleva '+q+' ud';
      return `<div class="prow" style="box-shadow:inset 3px 0 0 ${f.col};padding-left:10px">
        <span style="flex:1;min-width:0">${esc(p.n)}<small class="mut" style="display:block;font-size:12px">${txt}</small></span>
        <div class="stepper">
          <button onclick="setQty('${p.id}',${Math.max(0,v-1)})" aria-label="Quitar una unidad">${ic('minus',16)}</button>
          <input type="number" min="0" inputmode="numeric" value="${q===null?'':q}" placeholder="—" aria-label="Unidades de ${esc(p.n)}"
            onchange="setQty('${p.id}',this.value===''?null:Math.max(0,parseInt(this.value)||0))">
          <button onclick="setQty('${p.id}',${v+1})" aria-label="Añadir una unidad">${ic('plus',16)}</button>
        </div></div>`;
    }).join('');

function setQty(pid,v){
  const k=CLIENTS[cur].k;
  S.qty[k]=S.qty[k]||{};
  if(v===null)delete S.qty[k][pid];else S.qty[k][pid]=v;
  save();render();
}

let mo=today().slice(0,7);
const curMo=()=>today().slice(0,7);
const moName=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})};
const shiftMo=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fmtN=n=>Number(n||0).toLocaleString('es-ES');
const tgt=(f,m)=>{const v=(S.om[m]||{})[f.id];return v!==undefined?v:(f.ov??null)};
const prodTotal=pid=>CLIENTS.reduce((t,c)=>t+((S.qty[c.k]||{})[pid]||0),0);
const realOf=(f,m)=>{
  if(S.hist[m])return S.hist[m].act[f.id]||0;
  if(f.ou==='€')return (S.real[m]||{})[f.id]||0;
  return S.prod.filter(p=>p.f===f.id).reduce((s,p)=>s+prodTotal(p.id),0);
};
function setTgt(fid,v){
  const n=parseFloat(v);
  S.om[mo]=S.om[mo]||{};
  if(isNaN(n))delete S.om[mo][fid];else S.om[mo][fid]=n;
  save();toast('Objetivo de '+moName(mo)+' guardado','check');render();
}
function setReal(fid,v){S.real[mo]=S.real[mo]||{};S.real[mo][fid]=parseFloat(v)||0;save();render()}
function closeMo(){
  if(S.hist[mo])return toast('Este mes ya está cerrado','alert');
  if(!confirm('¿Cerrar '+moName(mo)+'? Se guarda el resultado y se ponen a cero los contadores de unidades de todos los clientes.'))return;
  const act={};S.fam.forEach(f=>act[f.id]=realOf(f,mo));
  S.hist[mo]={act};
  CLIENTS.forEach(c=>{delete S.qty[c.k]});
  mo=shiftMo(mo,1);save();toast('Mes cerrado. Empieza '+moName(mo),'check');render();
}
function obj(){
  if(!S.fam.length)return `<div class="empty">${ic('plus',34)}<p>Añade familias en Admin.</p></div>`;
  const closed=!!S.hist[mo];
  const nav=`<div class="mesnav"><button class="mini" onclick="mo=shiftMo(mo,-1);render()" aria-label="Mes anterior">${ic('back',16)}</button>
    <strong>${moName(mo)}</strong>
    <button class="mini" onclick="mo=shiftMo(mo,1);render()" aria-label="Mes siguiente" style="transform:scaleX(-1)">${ic('back',16)}</button></div>
    <p class="cap" style="margin:0 0 10px">${closed?'Mes cerrado · resultado guardado':'Mes abierto · los contadores son de este mes'}</p>`;
  return nav+S.fam.map(f=>{
    const t=tgt(f,mo), r=realOf(f,mo), U=f.ou||'uds', pct=t?Math.min(100,Math.round(r/t*100)):0;
    const ps=S.prod.filter(p=>p.f===f.id);
    return `<section class="form">
      <div class="brand" style="margin-bottom:6px"><strong style="font-family:'Barlow Condensed',sans-serif;font-size:20px;display:flex;gap:8px;align-items:center;color:${f.col}"><i class="sw big" style="background:${f.col}"></i>${esc(f.n)}</strong><small class="${pct>=100?'win':'mut'}">${t?(pct>=100?'🏆 ':'')+pct+'%':'Sin objetivo'}</small></div>
      <div class="bar"><i style="width:${pct}%;background:${f.col}"></i></div>
      <div class="objbot"><span>${fmtN(r)} ${U}${t?' de '+fmtN(t)+' '+U:''}</span>
        <label class="objin">Objetivo <input type="number" min="0" value="${t??''}" placeholder="—" onchange="setTgt('${f.id}',this.value)">${U}</label></div>
      ${f.ou==='€'?`<div class="objbot" style="margin-top:8px"><span class="mut">Facturado este mes</span>
        <label class="objin"><input type="number" min="0" value="${(S.real[mo]||{})[f.id]??''}" placeholder="0" ${closed?'disabled':''} onchange="setReal('${f.id}',this.value)">€</label></div>`:''}
      ${ps.length?`<details style="margin-top:8px"><summary class="mut" style="cursor:pointer">${ps.length} producto${ps.length>1?'s':''}</summary>
        ${ps.map(p=>`<div class="prow"><span>${esc(p.n)}</span><b>${fmtN(prodTotal(p.id))} ud</b></div>`).join('')}</details>`
        :`<p class="mut" style="font-size:13px;margin:8px 0 0">Sin productos. Añádelos en Admin.</p>`}
    </section>`;
  }).join('')+(closed?'':`<button class="bb primary" style="margin-top:6px;width:100%" onclick="closeMo()">${ic('check',20)}Cerrar ${moName(mo)}</button>`);
}

function importCat(){
  const lines=document.getElementById('imp').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return toast('Pega al menos una línea','alert');
  let nf=0,np=0;
  lines.forEach(l=>{
    const parts=l.split(/[;|]/);
    const fn=(parts[0]||'').trim(), prod=parts.slice(1).join(' ').trim();
    if(!fn)return;
    let f=S.fam.find(x=>norm(x.n)===norm(fn));
    if(!f){f={id:'f'+uid(),c:fn.slice(0,3).toUpperCase(),n:fn,col:PALETTE[S.fam.length%PALETTE.length]};S.fam.push(f);nf++}
    if(prod&&!S.prod.some(p=>p.f===f.id&&norm(p.n)===norm(prod))){S.prod.push({id:'p'+uid(),f:f.id,n:prod});np++}
  });
  save();toast(`${nf} familias y ${np} productos añadidos`,'check');render();
}

let ed=null;
function newC(){ed=null;prev='buscar';go('editar')}
function editC(){ed=cur;go('editar')}
function editar(){
  const c=ed===null?{n:'',c:'',a:'',p:'',t:'',o:[],days:[]}:CLIENTS[ed];
  if(!c)return go('buscar');
  return `<div class="brand" style="margin-bottom:0"><button class="bb ghost" onclick="go(ed===null?'buscar':'ficha')" aria-label="Volver">${ic('back',22)}</button><small>${ed===null?'Nuevo cliente':'Editar cliente'}</small></div>
  <section class="form" style="margin-top:10px">
    <label class="lb">Nombre del establecimiento</label><input id="e_n" value="${esc(c.n)}" placeholder="Ej. BAR LOS ARCOS">
    <div class="row2"><div><label class="lb">Código</label><input id="e_c" value="${esc(c.c)}" placeholder="Ej. 120286"></div>
    <div><label class="lb">Teléfono</label><input id="e_t" inputmode="tel" value="${esc(c.t)}"></div></div>
    <label class="lb">Dirección</label><input id="e_a" value="${esc(c.a)}" placeholder="Calle y número">
    <label class="lb">Persona de contacto</label><input id="e_p" value="${esc(c.p)}">
    <label class="lb">Días de reparto</label>
    <div class="seg" style="flex-wrap:wrap;overflow:visible" id="e_d">${DAYS.map(d=>`<button type="button" class="${c.days.includes(d)?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${LBL[d]}</button>`).join('')}</div>
    <label class="lb">Observaciones</label><textarea id="e_o" rows="2">${esc((c.o||[]).join(' · '))}</textarea>
    <button class="bb primary" style="margin-top:14px" onclick="saveC()">${ic('check',20)}Guardar cliente</button>
  </section>`;
}
function saveC(){
  const v=id=>document.getElementById(id).value.trim();
  const n=v('e_n');
  if(!n)return toast('Escribe el nombre del establecimiento','alert');
  const days=[...document.querySelectorAll('#e_d button.on')].map(b=>b.dataset.d);
  if(!days.length)return toast('Elige al menos un día de reparto','alert');
  const obs=v('e_o');
  const data={n,c:v('e_c'),a:v('e_a'),p:v('e_p'),t:v('e_t').replace(/\s+/g,''),o:obs?[obs]:[],days};
  if(ed===null){
    S.cli.push({k:'N'+uid(),...data});
    syncCli();cur=CLIENTS.length-1;save();toast('Cliente añadido');go('ficha');
  }else{
    Object.assign(CLIENTS[ed],data);save();syncCli();toast('Cliente actualizado');go('ficha');
  }
}
function delC(){
  const c=CLIENTS[cur];
  if(!confirm(`¿Eliminar «${c.n}»? Se borran también sus registros y sus productos marcados.`))return;
  S.cli=S.cli.filter(x=>x!==c);
  delete S.reg[c.k];delete S.st[c.k];delete S.qty[c.k];delete S.notes[c.k];
  save();syncCli();toast('Cliente eliminado','trash');go('ruta');
}

function ficha(){
  const c=CLIENTS[cur];
  if(!c)return go('ruta');
  const recs=(S.reg[c.k]||[]).slice().sort((a,b)=>a.f<b.f?1:-1);
  return `<div class="brand" style="margin-bottom:0"><button class="bb ghost" onclick="go(prev)" aria-label="Volver">${ic('back',22)}</button><small>${esc(c.c)}</small><span style="display:flex;gap:6px"><button class="bb ghost" onclick="editC()" aria-label="Editar cliente">${ic('edit',20)}</button><button class="bb ghost" onclick="delC()" aria-label="Eliminar cliente">${ic('trash',20)}</button></span></div>
  <header class="hero" style="margin-top:6px"><h2>${esc(c.n)}</h2><p>${esc(c.a)}</p>
  <p class="mut">${c.days.map(d=>LBL[d]).join(' · ')}${c.p?' · '+esc(c.p):''}</p></header>
  <div class="big">${c.t?`<a class="bb" href="tel:${esc(c.t)}">${ic('phone',20)}Llamar</a><a class="bb" href="https://wa.me/${esc(waNum(c.t))}" target="_blank">${ic('chat',20)}WhatsApp</a>`:''}
    <a class="bb" href="${mapUrl(c)}" target="_blank">${ic('pin',20)}Mapa</a></div>
  ${c.o.length?`<div class="note">${ic('note',18)}<span>${c.o.map(esc).join('<br>')}</span></div>`:''}
  ${S.prod.length?(()=>{const st=S.prod.map(p=>qtyOf(c.k,p.id));const y=st.filter(q=>q>0).length,nn=st.filter(q=>q===0).length,s0=st.filter(q=>q===null).length;
    return `<div class="cover"><div class="cov-top"><span>${y} de ${S.prod.length} productos</span><span class="mut">${nn} por ofertar · ${s0} sin revisar</span></div><div class="pcs">${chipsOf(c.k)}</div></div>`;})():''}
  <h3>Productos</h3>
  ${S.prod.length?`<div class="plist">${prodRows(c.k)}</div>`:'<p class="mut">Sin productos en el catálogo.</p>'}
  <h3>Registrar postventa</h3>
  <div class="form">
    <div class="seg" style="flex-wrap:wrap;overflow:visible">${TIPOS.map(t=>`<button class="${t===curTipo?'on':''}" onclick="curTipo='${t}';render()">${t}</button>`).join('')}</div>
    <label class="lb">Fecha</label><input type="date" value="${curFecha}" onchange="curFecha=this.value">
    <label class="lb">Qué ha pasado</label><textarea rows="3" placeholder="Describe la incidencia, el cobro o el pedido" oninput="curDesc=this.value">${esc(curDesc)}</textarea>
    <button class="bb primary" style="margin-top:12px" onclick="addRec()">${ic('check',20)}Guardar registro</button>
  </div>
  <h3>Historial</h3>
  ${recs.map(x=>`<article class="hist"><div class="top"><span class="tag ${x.e==='abierta'?'bad':'ok'}">${x.e==='abierta'?ic('alert',12)+'Abierta':ic('check',12)+'Resuelta'}</span>
    <span class="tag">${esc(x.tipo)}</span><span class="mut" style="font-size:13px">${fmt(x.f)}</span></div>
    <p style="margin:0">${esc(x.d)}</p>
    <div class="actions">
      <button onclick="toggleRec('${x.id}')" aria-label="${x.e==='abierta'?'Marcar resuelta':'Reabrir'}" title="${x.e==='abierta'?'Marcar resuelta':'Reabrir'}">${ic(x.e==='abierta'?'check':'undo',18)}</button>
      <button class="del" onclick="delRec('${x.id}')" aria-label="Eliminar registro" title="Eliminar">${ic('trash',18)}</button>
    </div></article>`).join('')||'<p class="mut">Sin registros todavía.</p>'}
  <h3>Notas internas</h3>
  <textarea rows="2" placeholder="Notas que solo ves tú" oninput="S.notes[CLIENTS[cur].k]=this.value;save()">${esc(S.notes[c.k]||'')}</textarea>`;
}

function addRec(){
  if(!curDesc.trim())return toast('Escribe qué ha pasado','alert');
  const k=CLIENTS[cur].k;
  (S.reg[k]=S.reg[k]||[]).push({id:uid(),tipo:curTipo,f:curFecha,d:curDesc.trim(),e:'abierta'});
  curDesc='';save();toast('Registro guardado');render();
}
function toggleRec(id){const r=findRec(id);if(r){r.x.e=r.x.e==='abierta'?'resuelta':'abierta';save();toast(r.x.e==='abierta'?'Registro reabierto':'Registro resuelto','undo');render()}}
function delRec(id){const r=findRec(id);if(r&&confirm('¿Eliminar este registro?')){S.reg[r.k]=S.reg[r.k].filter(x=>x.id!==id);save();toast('Registro eliminado','trash');render()}}

load();render();
</script></body></html>
